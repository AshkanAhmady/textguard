name: VS Code Extension

on:
  pull_request:
    paths:
      - "integrations/vscode/**"
      - ".github/workflows/vscode-extension.yml"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/vscode

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run check-types

      - name: Build
        run: npm run build

      - name: Package VSIX
        run: npx @vscode/vsce package --out textguard-vscode.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: textguard-vscode
          path: integrations/vscode/textguard-vscode.vsix
