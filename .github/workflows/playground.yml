name: Playground

on:
  pull_request:
    paths:
      - "integrations/playground/**"
      - "packages/core/**"
      - "packages/all/**"
      - ".github/workflows/playground.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Install Playground dependencies
        working-directory: integrations/playground
        run: npm install

      - name: Overlay current TextGuard packages
        working-directory: integrations/playground
        run: npm install --no-save ../../packages/core ../../packages/all

      - name: Type check
        working-directory: integrations/playground
        run: npm run check-types

      - name: Build
        working-directory: integrations/playground
        run: npm run build
