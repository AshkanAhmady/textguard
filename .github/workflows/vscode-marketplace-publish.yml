name: Publish VS Code Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact extension version to publish (for example 0.1.1)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    defaults:
      run:
        working-directory: integrations/vscode

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node -e "const pkg=require('./package.json'); const requested=process.env.REQUESTED_VERSION; if (pkg.version !== requested) { console.error('Requested version ' + requested + ' does not match package.json version ' + pkg.version); process.exit(1); } console.log('Publishing TextGuard VS Code ' + pkg.version);"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run check-types

      - name: Build
        run: npm run build

      - name: Package VSIX
        run: npx @vscode/vsce package --out textguard-vscode-${{ inputs.version }}.vsix

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: textguard-vscode-${{ inputs.version }}
          path: integrations/vscode/textguard-vscode-${{ inputs.version }}.vsix

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --packagePath textguard-vscode-${{ inputs.version }}.vsix --oidc
