name: PII Scan

on:
  pull_request:

jobs:
  pii-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history needed so `git diff <base> <head>` works —
          # a shallow checkout would only have the merge commit.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build PII dependency graph
        run: pnpm --filter @textguard/plugin-pii... build

      - name: Scan changed files for PII
        run: >
          node packages/guards/pii/dist/ci.js
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.sha }}
