name: Deploy Playground to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "integrations/playground/**"
      - "packages/core/**"
      - "packages/all/**"
      - "packages/languages/en/**"
      - "packages/detection/email/**"
      - "packages/detection/url/**"
      - "packages/detection/phone/**"
      - "packages/detection/ip/**"
      - "packages/detection/uuid/**"
      - "packages/detection/credit-card/**"
      - "packages/detection/iban/**"
      - ".github/workflows/playground-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Install Playground dependencies
        working-directory: integrations/playground
        run: npm install

      - name: Overlay current TextGuard packages
        working-directory: integrations/playground
        run: >-
          npm install --no-save
          ../../packages/core
          ../../packages/languages/en
          ../../packages/detection/email
          ../../packages/detection/url
          ../../packages/detection/phone
          ../../packages/detection/ip
          ../../packages/detection/uuid
          ../../packages/detection/credit-card
          ../../packages/detection/iban
          ../../packages/all

      - name: Type check
        working-directory: integrations/playground
        run: npm run check-types

      - name: Build
        working-directory: integrations/playground
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: integrations/playground/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
